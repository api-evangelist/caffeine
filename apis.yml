aid: caffeine
name: Caffeine
description: >-
  Caffeine was a social broadcasting and live-streaming platform founded in 2016
  by former Apple designers Ben Keighran and Sam Roberts, and backed by
  Andreessen Horowitz (a16z) and Greylock Partners. Built on a proprietary
  WebRTC-based real-time video distribution network, Caffeine positioned itself
  as a low-latency, social-first alternative to Twitch for gaming, entertainment,
  and — in its later years — live sports, partnering with roughly 200 sports
  organizations and reaching tens of millions of monthly users. The company
  published open-source broadcasting tooling under its caffeinetv GitHub
  organization (libcaffeine, caffeine-rtc, an OBS plugin, and the CaffQL GraphQL
  code generator) but never shipped a public, documented developer API program.
  Caffeine announced it was ceasing operations, and its web presence is now a
  shutdown notice; this profile is retained as an a16z portfolio lead and is
  archival rather than an active, integrable API provider.
